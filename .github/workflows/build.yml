name: Build AlertingSystem

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Restore and build frontend, backend, and shared contracts
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore .\AlertingSystem.sln

      - name: Build solution in Release mode
        run: dotnet build .\AlertingSystem.sln --configuration Release --no-restore
